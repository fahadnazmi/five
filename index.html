<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fivever</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23e63946' d='M32 56 8 33C-5 19 5 4 18 4c6 0 11 3 14 8 3-5 8-8 14-8 13 0 23 15 10 29L32 56Z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #000;
        --panel: rgba(0, 0, 0, 0.75);
        --border: rgba(255,255,255,0.2);
        --text: #f5f5f5;
        --muted: rgba(255,255,255,0.5);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
        color: var(--text);
        font-family: 'DM Mono', ui-monospace, monospace;
      }

      body {
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        position: fixed;
        inset: 0;
        background: var(--bg);
        cursor: text;
      }

      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .swatch {
        border: 0;
        width: 22px;
        height: 22px;
        padding: 0;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1.5px solid transparent;
        font: inherit;
        cursor: pointer;
      }

      .swatch-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
      }

      .bar {
        position: absolute;
        left: 24px;
        right: 24px;
        bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        font-size: 12px;
        letter-spacing: 0.04em;
        opacity: 0.72;
        color: var(--text);
      }

      .hints {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }

      .ctrls {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .hidden-input {
        position: fixed;
        left: 0;
        top: 0;
        width: 1px;
        height: 1px;
        margin: 0;
        padding: 0;
        border: 0;
        opacity: 0;
        font-size: 16px;
        color: transparent;
        background: transparent;
        caret-color: transparent;
        pointer-events: none;
      }

      .page-transition {
        position: fixed;
        inset: 0;
        z-index: 2000;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        background: rgba(17, 17, 17, 0.96);
        transform: scale(1.02);
        transition: opacity 0.28s ease, visibility 0.28s ease, transform 0.6s ease;
      }

      .page-transition.is-active {
        opacity: 1;
        visibility: visible;
        transform: scale(1);
      }

      @media (max-width: 600px) {
        .bar {
          left: 16px;
          right: 16px;
          bottom: 14px;
          gap: 10px;
        }
        .hints {
          gap: 12px;
          font-size: 11px;
        }
        .ctrls {
          flex: 1 1 100%;
          justify-content: space-between;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-transition" aria-hidden="true"></div>
    <div id="app">
      <canvas id="gardenCanvas"></canvas>
      <input id="hiddenInput" class="hidden-input" aria-label="Type to grow a garden" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" />

      <div id="hintBar" class="bar">
        <div class="hints">
          <span>type: </span>
          <span>note</span>
          <span>photos</span>
          <span>wordle</span>
          <span>sky</span>
          <span></span>
          <span></span>
          <span>click: for butterflies</span>
        </div>
        <div class="ctrls">
          <div id="swatches" style="display:flex;gap:6px;align-items:center;padding:4px 6px;border:1px solid #3A3A3A;border-radius:999px;background:rgba(0,0,0,0.8);"></div>
        </div>
      </div>
    </div>

    <script src="audio-controller.js"></script>
    <script>
      (() => {
        const APP = document.getElementById('app');
        const canvas = document.getElementById('gardenCanvas');
        const input = document.getElementById('hiddenInput');
        const swatchesEl = document.getElementById('swatches');
        const hintBar = document.getElementById('hintBar');

        const FONT_FAMILY = '"GT Ultra","Playfair Display",Georgia,serif';
        const SENT = '\u200B';

        const ROUTE_MAP = {
          note: 'note.html',
          photos: 'photos.html',
          wordle: 'wordle.html',
          sky: 'sky.html'
        };

        const PRESETS = [
          { id: 'breathe', label: 'Breathe', sub: 'Slow sway · 3s', T: 3000 },
          { id: 'grow', label: 'Grow & wither', sub: 'Bloom, then back · 6s', T: 6000 },
          { id: 'typed', label: 'Typed', sub: 'Type, cut, repeat · 5s', T: 5000 },
          { id: 'wind', label: 'Gust', sub: 'Wind sweeps through · 4s', T: 4000 },
          { id: 'reach', label: 'Reach', sub: 'Stems follow a light · 6s', T: 6000 },
          { id: 'scatter', label: 'Scatter', sub: 'Random bloom, fade · 6s', T: 6000 },
          { id: 'visit', label: 'Visitor', sub: 'Butterfly drops by · 7s', T: 7000 }
        ];

        const PAL = [
          ['Rose noir', '#000000', '#FF1400', '#3257FF', '#FFB4A8', '#FFFFFF'],
          ['Paper', '#F3EEE4', '#FF3B1F', '#1C2B8F', '#FFD2C4', '#111111'],
          ['Midnight', '#0D1B4C', '#FF5A4E', '#9FB4FF', '#FFD6CF', '#FFFFFF'],
          ['Citrus', '#0E1A12', '#FF8A00', '#1FA463', '#FFE2B8', '#FFF6E8'],
          ['Orchid', '#140A1F', '#E63CFF', '#2FB8A6', '#F9D1FF', '#FFFFFF'],
          ['Moss', '#133A2A', '#FFB7C5', '#7FD18B', '#FFFFFF', '#F6F1E7'],
          ['Tomato', '#FF1400', '#FFF1E0', '#0B0B0B', '#FF1400', '#000000'],
          ['Butter', '#FFE9A8', '#E4002B', '#0F5132', '#FFC2C2', '#1A1A1A'],
          ['Blush', '#FAD4D8', '#C8102E', '#274690', '#FFE3E6', '#1A1A1A'],
          ['Mono', '#000000', '#F2F2F2', '#6E6E6E', '#000000', '#FFFFFF']
        ];

        class TypeGarden {
          constructor() {
            this.ctx = canvas.getContext('2d');
            this.uid = 1;
            this.letters = [];
            this.cache = {};
            this.fontReady = false;
            this.state = { mode: 'intro', palette: 0, text: 'in bloom', seed: 7, status: '', busy: false };
            this.rand = Math.random;
            this.lastKey = 0;
            this.Sd = 0;
            this.St = 0;
            this.cx = 0;
            this.cy = 0;
            this.ctx_ = 0;
            this.cty = 0;
            this.mx = null;
            this.my = null;
            this.flies = [];
            this.perch = [];
            this.fa = {};
            this._kd = false;
            this.iv = SENT;
            this.composing = false;
            this.W = 0;
            this.H = 0;
            this.dpr = window.devicePixelRatio || 1;
            this._now = 0;
            this.g = this.ctx;
            this.P = null;
            this.pt0 = 0;
            this.t0 = performance.now();
          }

          pal() {
            const p = PAL[this.state.palette] || PAL[0];
            return {
              bg: p[1],
              C: { red: p[2], blue: p[3], line: p[4], text: p[5], vein: p[1] }
            };
          }

          h(n) {
            const x = Math.sin(n) * 43758.5453;
            return x - Math.floor(x);
          }

          rng(seed) {
            let s = seed | 0;
            return () => {
              s = (s + 0x6D2B79F5) | 0;
              let t = Math.imul(s ^ (s >>> 15), 1 | s);
              t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
              return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
            };
          }

          spr(t, k = 7, w = 16) {
            if (t <= 0) return 0;
            return 1 - Math.exp(-t * k) * Math.cos(t * w);
          }

          eo(t) {
            if (t <= 0) return 0;
            if (t >= 1) return 1;
            return 1 - Math.pow(1 - t, 3);
          }

          mw(ch) {
            if (this.cache[ch] != null) return this.cache[ch];
            this.ctx.font = `700 100px ${FONT_FAMILY}`;
            let w = this.ctx.measureText(ch).width / 100;
            if (ch === ' ') w *= 1.4;
            return (this.cache[ch] = w);
          }

          backend(g) {
            return {
              fill: (p, col) => {
                g.beginPath();
                this.path(g, p, true);
                g.fillStyle = col;
                g.fill();
              },
              stroke: (p, col, w) => {
                g.beginPath();
                this.path(g, p, false);
                g.strokeStyle = col;
                g.lineWidth = w;
                g.lineCap = 'round';
                g.lineJoin = 'round';
                g.stroke();
              },
              rect: (x, y, w, h, col) => {
                g.fillStyle = col;
                g.fillRect(x, y, w, h);
              },
              text: (ch, x, y, S, col) => {
                g.font = `700 ${S}px ${FONT_FAMILY}`;
                g.textAlign = 'center';
                g.textBaseline = 'alphabetic';
                g.fillStyle = col;
                g.fillText(ch, x, y);
              }
            };
          }

          path(c, p, closed) {
            const n = p.length;
            if (n < 2) return;
            const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
            if (closed) {
              const s = m(p[n - 1], p[0]);
              c.moveTo(s[0], s[1]);
              for (let i = 0; i < n; i++) {
                const q = m(p[i], p[(i + 1) % n]);
                c.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]);
              }
              c.closePath();
            } else {
              c.moveTo(p[0][0], p[0][1]);
              for (let i = 1; i < n - 1; i++) {
                const q = m(p[i], p[i + 1]);
                c.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]);
              }
              c.lineTo(p[n - 1][0], p[n - 1][1]);
            }
          }

          bez(a, b, c1, d, n) {
            const P = [];
            for (let i = 0; i <= n; i++) {
              const t = i / n, u = 1 - t;
              P.push([
                u * u * u * a[0] + 3 * u * u * t * b[0] + 3 * u * t * t * c1[0] + t * t * t * d[0],
                u * u * u * a[1] + 3 * u * u * t * b[1] + 3 * u * t * t * c1[1] + t * t * t * d[1]
              ]);
            }
            return P;
          }

          vine(base, dir, len, amp, waves, ph, bend, n = 40) {
            const P = [[base[0], base[1]]];
            const step = len / n;
            let x = base[0], y = base[1];
            for (let i = 1; i <= n; i++) {
              const u = i / n;
              const a = dir + bend * u + amp * Math.sin(u * Math.PI * waves + ph) * Math.min(1, u * 3);
              x += Math.cos(a) * step;
              y += Math.sin(a) * step;
              P.push([x, y]);
            }
            return P;
          }

          curl(P, sign, rad) {
            const n = P.length;
            const e = P[n - 1];
            const a = Math.atan2(e[1] - P[n - 2][1], e[0] - P[n - 2][0]);
            const c = [e[0] - Math.sin(a) * sign * rad, e[1] + Math.cos(a) * sign * rad];
            const a0 = Math.atan2(e[1] - c[1], e[0] - c[0]);
            for (let i = 1; i <= 14; i++) {
              const u = i / 14;
              const t = a0 + sign * u * Math.PI * 1.6;
              const rr = rad * (1 - 0.5 * u);
              P.push([c[0] + Math.cos(t) * rr, c[1] + Math.sin(t) * rr]);
            }
            return P;
          }

          at(P, u) {
            const n = P.length;
            const i = Math.min(n - 2, Math.max(1, Math.round(u * (n - 1))));
            return [P[i], Math.atan2(P[i + 1][1] - P[i - 1][1], P[i + 1][0] - P[i - 1][0])];
          }

          weave(r, startLayer) {
            const cuts = [];
            const nc = 1 + Math.floor(r() * 3);
            for (let i = 0; i < nc; i++) cuts.push(0.15 + r() * 0.7);
            cuts.sort((a, b) => a - b);
            const segs = [];
            let u0 = 0, layer = startLayer;
            for (const c of cuts) {
              if (c <= u0) continue;
              segs.push({ u0, u1: c, layer });
              if (r() < 0.3) {
                const g = 0.02 + r() * 0.03;
                u0 = Math.min(0.98, c + g);
              } else u0 = c;
              layer = 1 - layer;
            }
            segs.push({ u0, u1: 1, layer });
            return segs;
          }

          layerAt(segs, u) {
            for (const s of segs) if (u >= s.u0 && u <= s.u1) return s.layer;
            return segs[segs.length - 1].layer;
          }

          jit(id, f, amp) {
            if (!amp) return [0, 0, 0];
            return [
              (this.h(id * 1.37 + f * 7.13) * 2 - 1) * amp,
              (this.h(id * 2.71 + f * 3.11) * 2 - 1) * amp,
              (this.h(id * 5.3 + f * 1.7) * 2 - 1) * 0.035
            ];
          }

          wordParams(ws) {
            const r = this.rng(ws * 7 + 13);
            const dens = 1;
            return { roseP: 0.3 + r() * 0.3, leafy: (0.6 + r() * 0.8) * dens, dens, lean: (r() - 0.5) * 0.6, big: 0.85 + r() * 0.45, curvy: 0.8 + r() * 0.6, bridgeP: Math.min(0.95, (0.45 + r() * 0.35) * dens), w: 0.5 };
          }

          grow(r, E, nid, p, o) {
            const tip = o.tip || (r() < p.roseP ? 'rose' : r() < 0.45 ? 'fan' : r() < 0.6 ? 'leaf' : 'curl');
            let P = o.pts || this.vine(o.base, o.dir, o.len, (0.35 + r() * 0.45) * p.curvy, 1 + r() * 1.6, r() * 6.28, (r() - 0.5) * 1.2, 40);
            if (tip === 'curl') P = this.curl(P, r() < 0.5 ? -1 : 1, 0.05 + r() * 0.05);
            const segs = this.weave(r, o.layer0 != null ? o.layer0 : (r() < 0.5 ? 0 : 1));
            const dur = Math.max(320, (o.len || 0.8) * 620);
            const thorns = [];
            const nt = Math.floor(r() * 2.5);
            for (let i = 0; i < nt; i++) thorns.push({ u: 0.15 + r() * 0.65, s: r() < 0.5 ? -1 : 1 });
            E.push({ t: 'stem', id: nid(), pts: P, segs, d0: o.d0, dur, w: o.depth ? 0.82 : 1, thorns });
            const nl = Math.floor(r() * 2.8 * p.leafy);
            let sd = r() < 0.5 ? -1 : 1;
            for (let i = 0; i < nl; i++) {
              const u = 0.25 + r() * 0.6;
              const [q, a] = this.at(P, u);
              sd = -sd;
              E.push({ t: 'leaf', id: nid(), x: q[0], y: q[1], a: a + sd * (0.55 + r() * 0.5), L: (0.14 + r() * 0.2) * (o.depth ? 0.8 : 1), bend: (r() - 0.5) * 1.2, layer: this.layerAt(segs, u), d0: o.d0 + dur * u });
            }
            const [tp, ta] = this.at(P, 1);
            const td = o.d0 + dur * 0.8;
            const tl = this.layerAt(segs, 1);
            if (tip === 'rose') {
              const R = (0.13 + r() * 0.15) * p.big * (o.depth ? 0.75 : 1);
              const over = tp[1] > -0.78 && tp[1] < 0.05 && Math.abs(tp[0]) < p.w * 0.5;
              const layer = over ? (r() < 0.22 ? 1 : 0) : (r() < 0.6 ? 1 : tl);
              E.push({ t: 'rose', id: nid(), x: tp[0], y: tp[1], R, rot: (r() - 0.5) * 1.0, ph1: r() * 6.28, ph2: r() * 6.28, turns: 1.8 + r() * 1, layer, d0: td });
              if (r() < 0.2) {
                const oo = ta + (r() < 0.5 ? 1 : -1) * 1.3;
                E.push({ t: 'rose', id: nid(), x: tp[0] + Math.cos(oo) * R * 1.4, y: tp[1] + Math.sin(oo) * R * 1.4, R: R * (0.6 + r() * 0.3), rot: (r() - 0.5) * 1.2, ph1: r() * 6.28, ph2: r() * 6.28, turns: 1.8 + r(), layer, d0: td + 120 });
              }
            } else if (tip === 'fan') {
              const spread = 0.6 + r() * 0.3;
              for (let j = 0; j < 2; j++) E.push({ t: 'leaf', id: nid(), x: tp[0], y: tp[1], a: ta + (j - 0.5) * spread, L: 0.2 + r() * 0.2, bend: (j - 0.5) * 0.8, layer: tl, d0: td + j * 60 });
            } else if (tip === 'leaf') {
              E.push({ t: 'leaf', id: nid(), x: tp[0], y: tp[1], a: ta + (r() - 0.5) * 0.3, L: 0.16 + r() * 0.16, bend: (r() - 0.5), layer: tl, d0: td });
            }
            if (!o.depth && r() < 0.3) {
              const u = 0.35 + r() * 0.35;
              const [q, a] = this.at(P, u);
              this.grow(r, E, nid, p, { base: q, dir: a + (r() < 0.5 ? -1 : 1) * (0.7 + r() * 0.4), len: (o.len || 0.8) * (0.35 + r() * 0.2), d0: o.d0 + dur * u, depth: 1, layer0: this.layerAt(segs, u) });
            }
            return P;
          }

          gen(l) {
            const r = this.rng((l.ws ^ Math.imul(l.wi + 1, 2654435761)) + Math.floor(this.rand() * 1e6));
            const p = this.wordParams(l.ws);
            const E = [];
            let k0 = 0;
            const nid = () => l.id * 100 + (k0++);
            const w = this.mw(l.ch);
            const inX = () => (r() - 0.5) * w * 0.7;
            p.w = w;
            const nUp = 1 + (r() < 0.45 * p.dens ? 1 : 0);
            for (let i = 0; i < nUp; i++) {
              this.grow(r, E, nid, p, { base: [inX(), -r() * 0.3], dir: -Math.PI / 2 + p.lean * 0.5 + (r() - 0.5) * 0.7, len: 0.6 + r() * 0.5, d0: 40 + i * 130, tip: l.wi === 0 && i === 0 ? 'rose' : null });
            }
            if (r() < 0.4 * p.dens) this.grow(r, E, nid, p, { base: [inX(), -0.1 - r() * 0.35], dir: Math.PI / 2 + (r() - 0.5) * 0.8, len: 0.35 + r() * 0.35, d0: 160 });
            if (l.prev && r() < p.bridgeP) {
              const px = -(this.mw(l.prev.ch) + w) / 2;
              const a = [inX(), -0.05 - r() * 0.55];
              const b = [px + (r() - 0.5) * 0.25, -0.05 - r() * 0.55];
              const bulge = (r() < 0.55 ? -1 : 1) * (0.4 + r() * 0.4);
              const dx = b[0] - a[0];
              let P = this.bez(a, [a[0] + dx * 0.15, a[1] + bulge], [b[0] - dx * 0.15, b[1] + bulge * 0.9], b, 40);
              if (r() < 0.45) P = P.slice(0, Math.floor(P.length * (0.7 + r() * 0.2)));
              this.grow(r, E, nid, p, { pts: P, len: Math.abs(dx) + Math.abs(bulge), d0: 90, tip: r() < 0.5 ? 'curl' : r() < 0.5 ? 'leaf' : 'rose' });
            }
            if (l.wi === 0) this.grow(r, E, nid, p, { base: [-w * 0.3, -0.15 - r() * 0.4], dir: Math.PI + (r() - 0.5) * 1.2, len: 0.45 + r() * 0.3, d0: 120, tip: 'curl' });
            l.els = E;
            l.endEls = null;
            const T = [];
            const tr = this.rng(l.id * 977 + Math.floor(this.rand() * 1e6));
            this.grow(tr, T, () => l.id * 100 + 90 + T.length, p, { base: [w * 0.25, -0.1 - tr() * 0.45], dir: (tr() - 0.5) * 1.4, len: 0.45 + tr() * 0.25, d0: 0, tip: 'curl', depth: 1 });
            l.tend = T.filter(e => e.t === 'stem').slice(0, 1);
          }

          genEnd(l, rel) {
            const r = this.rng(l.ws + l.wi * 31 + Math.floor(this.rand() * 1e6));
            const p = this.wordParams(l.ws);
            const E = [];
            let k0 = 50;
            const nid = () => l.id * 100 + (k0++);
            const w = this.mw(l.ch);
            const n = 1 + Math.floor(r() * 2.5);
            p.w = w;
            for (let i = 0; i < n; i++) {
              const dir = -Math.PI / 2 + 0.6 + (i - (n - 1) / 2) * 0.9 + (r() - 0.5) * 0.4;
              this.grow(r, E, nid, p, { base: [(r() - 0.2) * w * 0.6, -r() * 0.5], dir, len: 0.4 + r() * 0.45, d0: rel + 40 + i * 90, depth: 1, tip: i === 0 || r() < 0.5 ? 'rose' : 'fan' });
            }
            l.endEls = E;
          }

          strokeRange(B, P, a, b, col, w) {
            const n = P.length - 1;
            const ia = a * n;
            const ib = b * n;
            const lerp = t => {
              const i = Math.min(n - 1, Math.floor(t));
              const f = t - i;
              return [P[i][0] + (P[i + 1][0] - P[i][0]) * f, P[i][1] + (P[i + 1][1] - P[i][1]) * f];
            };
            const pts = [lerp(ia)];
            for (let i = Math.floor(ia) + 1; i < ib; i++) pts.push(P[i]);
            pts.push(lerp(ib));
            if (pts.length >= 2) B.stroke(pts, col, w);
          }

          thorn(B, P, u, s, S) {

          render(B, now, st) {

          wpt(st, l, x, y) {

          key(e) {

          spawnFly(cx, cy) {

          flyOff(f) {

          butterfly(B, x, y, s, ang, o, C) {

          drawFlies(B, now, C) {
            const dt = Math.min(48, now - (this._fl || now));
            this._fl = now;
            const byId = {};
            for (const p of this.perch) byId[p.id] = p;
            this.flies = this.flies.filter(f => {
              const t = (now - f.t0) / 1000;
              let tx, ty;
              if (f.st === 'sit' || f.st === 'fly') {
                const p = byId[f.pid];
                if (!p) this.flyOff(f);

              }
              if (f.st === 'wander') {
                tx = f.hx + Math.sin(t * 1.3 + f.seed) * 70;
                ty = f.hy + Math.sin(t * 2.1 + f.seed) * 40;
                if (t > 3.5) this.flyOff(f);
              }
              if (f.st === 'leave') { tx = f.ex; ty = f.ey; }
              if (f.st === 'sit') {
                f.x += (tx - f.x) * 0.35; f.y += (ty - f.y) * 0.35; f.ang *= 0.85; f.ph += dt * 0.004; const burst = Math.sin(now / 1000 * 0.9 + f.seed) > 0.75; f.open = burst ? 0.2 + 0.8 * Math.abs(Math.cos(now / 1000 * 9 + f.seed)) : 0.25 + 0.15 * Math.sin(f.ph);
              } else {
                const dx = tx - f.x, dy = ty - f.y, d = Math.hypot(dx, dy) || 1, sp = f.st === 'leave' ? 0.42 : Math.min(0.34, 0.06 + d * 0.0016);
                const flut = Math.sin(t * 7 + f.seed) * 0.12, wob = Math.cos(t * 4.3 + f.seed) * 0.1;
                const ax = (dx / d * sp + wob) - f.vx, ay = (dy / d * sp + flut) - f.vy;
                f.vx += ax * 0.06 * dt / 16; f.vy += ay * 0.06 * dt / 16;
                f.x += f.vx * dt; f.y += f.vy * dt + Math.sin(t * 13 + f.seed) * 0.6; f.ang += (Math.max(-0.5, Math.min(0.5, f.vx * 1.4)) - f.ang) * 0.1; f.open = Math.abs(Math.cos(t * 17 + f.seed));
                if (f.st === 'fly' && d < 5) { f.st = 'sit'; f.ph = 0; }
                if (f.st === 'leave' && (f.x < -60 || f.x > this.W + 60 || f.y < -60)) return false;
              }
              this.butterfly(B, f.x, f.y, f.sz, f.ang, f.open, C);
              return true;
            });
          }

          buildPoster() {
            if (!this.g) return;
            const s = this.state, pr = PRESETS.find(p => p.id === this.state.preset) || PRESETS[0];
            const text = (s.text || '').slice(0, 40) || ' ';
            this.rand = this.rng(s.seed * 7919 + 1);
            const L = []; let prev = null, uid = 1;
            for (const ch of text) {
              if (ch === ' ') { const sp = { ch: ' ', id: 9000 + uid++, els: [] }; L.push(sp); prev = sp; continue; }
              const same = prev && prev.ch !== ' ';
              const l = { ch, id: 9000 + uid++, ws: same ? prev.ws : Math.floor(this.rand() * 1e9), wi: same ? prev.wi + 1 : 0, prev: same ? prev : null };
              this.gen(l); L.push(l); prev = l;
            }
            const n = L.length;
            const step = pr.id === 'grow' ? Math.min(110, 3000 / n) : pr.id === 'typed' ? Math.min(85, 3600 / n) : 0;
            const off = pr.id === 'grow' ? 200 : pr.id === 'typed' ? 300 : 0;
            L.forEach((l, i) => { l.b = off + i * step; });
            if (pr.id === 'scatter') { const r = this.rng(s.seed * 31 + 5); L.forEach(l => { l.b = 150 + r() * 2400; }); }
            const wd = Math.min(60, 900 / n);
            L.forEach((l, i) => {
              l.d = pr.id === 'scatter' ? 4700 + i * 8 : 4200 + (n - 1 - i) * wd;
              const nx = L[i + 1];
              l.cutRel = null;
              if (pr.id !== 'scatter' && l.ch !== ' ' && nx && nx.ch === ' ') { l.cutRel = Math.max(30, nx.b - l.b); this.genEnd(l, l.cutRel); }
            });
            this.rand = Math.random;
            const res = this.layoutCore(L, 1080, 1080, false);
            let S = res.S, x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
            const addP = (l, x, y, r) => {
              const X = l.tx + x * S, Y = l.ty + y * S, R = (r || 0) * S;
              x0 = Math.min(x0, X - R); x1 = Math.max(x1, X + R); y0 = Math.min(y0, Y - R); y1 = Math.max(y1, Y + R);
            };
            for (const l of L) {
              if (l.ch === ' ') continue;
              addP(l, -l.tw / S / 2, -0.75); addP(l, l.tw / S / 2, 0.1);
              const all = [...l.els, ...(l.endEls || [])];
              for (const e of all) {
                if (e.t === 'stem') e.pts.forEach(q => addP(l, q[0], q[1], 0.02));
                else if (e.t === 'leaf') addP(l, e.x, e.y, e.L);
                else addP(l, e.x, e.y, e.R * 1.15);
              }
            }
            let tx0 = 1e9, tx1 = -1e9, ty0 = 1e9, ty1 = -1e9;
            for (const l of L) if (l.ch !== ' ') { tx0 = Math.min(tx0, l.tx - l.tw / 2); tx1 = Math.max(tx1, l.tx + l.tw / 2); ty0 = Math.min(ty0, l.ty - 0.72 * S); ty1 = Math.max(ty1, l.ty); }
            const Z = 1080, half = Z * 0.44, bcx = (tx0 + tx1) / 2, bcy = (ty0 + ty1) / 2;
            const k = Math.min(1.25, half / Math.max(1, bcx - x0, x1 - bcx), half / Math.max(1, bcy - y0, y1 - bcy));
            L.forEach(l => { l.tx = Z / 2 + (l.tx - bcx) * k; l.ty = Z / 2 + (l.ty - bcy) * k; l.tw *= k; l.x = l.tx; l.y = l.ty; });
            this.P = { letters: L, S: S * k, T: pr.T, preset: pr.id };
            this.pt0 = performance.now();
          }

          posterDraw(g, t) {
            const P = this.P; if (!P) return;
            const Z = 1080, pc = this.pal();
            g.setTransform(1, 0, 0, 1, 0, 0);
            g.fillStyle = pc.bg; g.fillRect(0, 0, Z, Z);
            const tt = ((t % P.T) + P.T) % P.T, L = P.letters, B = this.backend(g);
            const st = { letters: L, S: P.S, C: pc.C, boil: true, recoil: 20, speed: 1, wither: 600, textAll: true };
            L.forEach(l => { l.x = l.tx; l.y = l.ty; l.dead = null; });
            const set = base => L.forEach(l => { l.birth = base + l.b; l.tb = l.birth; l.cut = l.cutRel != null ? l.birth + l.cutRel : null; });
            let bars = null;
            if (P.preset === 'reference') {
              if (tt < 1950) { set(-1e5); bars = 1; }
              else if (tt < 2050) return;
              else if (tt < 2600) { this.bars(B, P, st, 0, this.eo((tt - 2050) / 550)); return; }
              else { const e = this.eo((tt - 2600) / 400); const lc = {}; L.forEach(l => { if (l.ch === ' ') return; const b = lc[l.line] || (lc[l.line] = [1e9, -1e9]); b[0] = Math.min(b[0], l.tx - l.tw / 2); b[1] = Math.max(b[1], l.tx + l.tw / 2); }); L.forEach(l => { const b = lc[l.line], c = b ? (b[0] + b[1]) / 2 : 540; l.x = c + (l.tx - c) * e; }); set(3000); st.speed = 2.2; bars = e; }
            } else if (P.preset === 'breathe') {
              set(-1e5);
              const ph = tt / P.T * Math.PI * 2, S = P.S;
              st.warp = (x, y, l) => { const h = Math.max(0, (l.y - y) / S); return [x + Math.sin(ph + l.x * 0.004 + h * 1.1) * S * 0.03 * h, y + Math.cos(ph + x * 0.003) * S * 0.008 * h]; };
              st.rotw = e => Math.sin(ph + e.id * 0.7) * 0.12;
            } else if (P.preset === 'grow' || P.preset === 'scatter') {
              set(0);
              L.forEach(l => { if (tt >= l.d) l.dead = l.d; });
            } else if (P.preset === 'wind') {
              set(-1e5);
              const S = P.S, u = tt / P.T, front = -0.35 + u * 1.9;
              st.warp = (x, y, l) => { const hh = Math.max(0, (l.y - y) / S), d = l.x / 1080 - front; const g = d < 0 ? Math.exp(d * 2.2) * Math.cos(-d * 9) : Math.exp(-d * d * 30); const idle = Math.sin(tt / 1000 * 1.6 + l.x * 0.01) * 0.012; return [x + (g * 0.13 + idle) * S * hh * hh * 0.6 + (g * 0.13 + idle) * S * hh * 0.4, y + Math.abs(g) * 0.02 * S * hh]; };
              st.rotw = e => { const d = e.x / 1080 - front; return (d < 0 ? Math.exp(d * 2.2) * Math.cos(-d * 9) : Math.exp(-d * d * 30)) * 0.35; };
            } else if (P.preset === 'reach') {
              set(-1e5);
              const S = P.S, ph = tt / P.T * Math.PI * 2, lx = 540 + Math.sin(ph) * 430, ly = 540 + Math.sin(ph * 2) * 260;
              this._light = [lx, ly];
              st.warp = (x, y, l) => { const dx = lx - l.x, dy = ly - (l.y - S * 0.6), d = Math.hypot(dx, dy) || 1, w = Math.max(0, 1 - d / 560), s = w * w * (3 - 2 * w); const hh = Math.min(2.5, Math.max(0, (l.y - y) / S)), f = hh * hh * 0.5 + hh * 0.5; return [x + dx / d * s * S * 0.12 * f, y + dy / d * s * S * 0.06 * f]; };
              st.rotw = e => { const a = Math.atan2(ly - e.y, lx - e.x); return Math.sin(a) * 0.15; };
            } else if (P.preset === 'visit') {
              set(-1e5);
              st.perchOn = true; this.perch = [];
              const ph = tt / P.T * Math.PI * 2;
              st.warp = (x, y, l) => { const hh = Math.max(0, (l.y - y) / P.S); return [x + Math.sin(ph + l.x * 0.004 + hh) * P.S * 0.015 * hh, y]; };
            } else {
              if (tt >= 4400) return; set(0); st.letters = L.filter(l => tt >= l.birth); st.textAll = false;
            }
            this.render(B, tt, st);
            if (bars != null) this.bars(B, P, st, bars, 1);
            if (P.preset === 'reach') {
              const [lx, ly] = this._light, r = P.S * 0.09, pts = [];
              for (let k = 0; k < 20; k++) { const a = k / 20 * Math.PI * 2; pts.push([lx + Math.cos(a) * r, ly + Math.sin(a) * r]); }
              B.fill(pts, st.C.line);
            }
            if (P.preset === 'visit') this.posterFly(B, tt, P, st.C);
            if (P.preset === 'typed') {
              const born = st.letters, last = born[born.length - 1], S = P.S;
              if (Math.floor(tt / 400) % 2 === 0 || (last && tt - last.birth < 300)) {
                const x = last ? last.tx + last.tw / 2 + 0.07 * S : 540, y = last ? last.ty - 0.33 * S : 540, w = Math.max(2, S * 0.03), h = 0.8 * S;
                B.rect(x - w / 2, y - h / 2, w, h, st.C.text);
              }
            }
          }

          bars(B, P, st, spread, hf) {
            const S = P.S, byLine = {};
            for (const l of P.letters) { if (l.ch === ' ') continue; const b = byLine[l.line] || (byLine[l.line] = { a: 1e9, z: -1e9, y: l.ty }); b.a = Math.min(b.a, l.tx - l.tw / 2); b.z = Math.max(b.z, l.tx + l.tw / 2); }
            const w = Math.max(2, S * 0.035), h = 1.0 * S * hf;
            for (const k in byLine) {
              const b = byLine[k], cx = (b.a + b.z) / 2, half = (b.z - b.a) / 2 + 0.14 * S, cy = b.y - 0.33 * S;
              B.rect(cx - half * spread - w / 2, cy - h / 2, w, h, st.C.text);
              B.rect(cx + half * spread - w / 2, cy - h / 2, w, h, st.C.text);
            }
          }

          posterFly(B, tt, P, C) {
            const ps = this.perch.slice().sort((a, b) => a.x - b.x);
            if (!ps.length) return;
            const p1 = ps[Math.floor(ps.length * 0.25)], p2 = ps[Math.min(ps.length - 1, Math.floor(ps.length * 0.75))];
            const A = [-80, 300], s1 = [p1.x, p1.y - p1.R * 0.55], s2 = [p2.x, p2.y - p2.R * 0.55], E = [1160, 260];
            const sz = Math.max(12, P.S * 0.09), t = tt / 1000, eo = v => this.eo(Math.max(0, Math.min(1, v)));
            const leg = (a, b, u, lift) => {
              const e = eo(u);
              return [a[0] + (b[0] - a[0]) * e, a[1] + (b[1] - a[1]) * e - Math.sin(e * Math.PI) * lift];
            };
            let p, flying = true, vx = 0;
            if (t < 1.8) { p = leg(A, s1, t / 1.8, 160); vx = 1; }
            else if (t < 3.4) { p = s1; flying = false; }
            else if (t < 4.6) { p = leg(s1, s2, (t - 3.4) / 1.2, 140); vx = s2[0] > s1[0] ? 1 : -1; }
            else if (t < 5.8) { p = s2; flying = false; }
            else { p = leg(s2, E, (t - 5.8) / 1.2, 60); vx = 1; }
            let o, ang;
            if (flying) {
              o = Math.abs(Math.cos(t * 17)); p = [p[0] + Math.sin(t * 7) * 6, p[1] + Math.sin(t * 13) * 4]; ang = vx * 0.3;
            } else {
              const burst = (t > 2.4 && t < 2.8) || (t > 5 && t < 5.3); o = burst ? 0.2 + 0.8 * Math.abs(Math.cos(t * 9)) : 0.3 + 0.1 * Math.sin(t * 3); ang = 0;
            }
            this.butterfly(B, p[0], p[1], sz, ang, o, C);
          }

          introSequence() {
            const phrases = ['made with love', 'for you', 'happy 5th', 'type away'];
            const key = 'type-garden-intro-seen';
            if (window.localStorage && window.localStorage.getItem(key) === 'true') {
              this.state.mode = 'type';
              setTimeout(() => input.focus({ preventScroll: true }), 80);
              return;
            }

            const typePhrase = (phrase, done) => {
              let i = 0;
              const tick = () => {
                if (i >= phrase.length) {
                  setTimeout(done, 500);
                  return;
                }
                const ch = phrase[i];
                const now = performance.now();
                if (ch === ' ') {
                  const last = this.letters.filter(l => !l.dead).at(-1);
                  if (last && last.ch !== ' ') {
                    last.cut = now;
                    this.genEnd(last, now - last.birth);
                  }
                  this.letters.push({ ch: ' ', id: this.uid++, birth: now, els: [] });
                  this.layout();
                } else {
                  this.add(ch, now);
                }
                i += 1;
                setTimeout(tick, ch === ' ' ? 120 : 80);
              };
              tick();
            };

            const clearLetters = (done) => {
              this.letters = [];
              this.layout();
              setTimeout(done, 220);
            };

            const run = (index = 0) => {
              if (index >= phrases.length) {
                this.state.mode = 'type';
                if (window.localStorage) window.localStorage.setItem(key, 'true');
                setTimeout(() => input.focus({ preventScroll: true }), 120);
                return;
              }

              const phrase = phrases[index];
              this.letters = [];
              this.layout();
              typePhrase(phrase, () => {
                clearLetters(() => {
                  setTimeout(() => run(index + 1), 150);
                });
              });
            };

            this.state.mode = 'intro';
            run();
          }

          initUI() {
            input.value = SENT;
            input.addEventListener('input', (e) => this.inputDiff(e.target));
            input.addEventListener('compositionstart', () => { this.composing = true; });
            input.addEventListener('compositionend', () => { this.composing = false; setTimeout(() => { const f = input; if (f && !this.composing) this.inputDiff(f); }, 0); });
            window.addEventListener('keydown', (e) => this.key(e));
            window.addEventListener('pointermove', (e) => { this.mx = e.clientX; this.my = e.clientY; });
            window.addEventListener('pointerleave', () => { this.mx = null; this.my = null; });
            window.addEventListener('pointerdown', (e) => {
              if (this.state.mode === 'type') {
                input.focus({ preventScroll: true });
                const rect = canvas.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) this.spawnFly(e.clientX - rect.left, e.clientY - rect.top);
              }
            });
            window.addEventListener('resize', () => this.resize());
            document.fonts && document.fonts.load(`700 100px ${FONT_FAMILY}`).then(() => { this.fontReady = true; this.layout(); }).catch(() => {});
            this.bindPaletteButtons();
            this.resize();
            this.introSequence();
          }

          applyPalette(palette) {
            const p = palette || PAL[this.state.palette] || PAL[0];
            const text = p[5];
            document.documentElement.style.setProperty('--bg', p[1]);
            document.documentElement.style.setProperty('--text', text);
            document.documentElement.style.setProperty('--muted', text);
            document.body.style.background = p[1];
            document.body.style.color = text;
            APP.style.background = p[1];
            hintBar.style.color = text;
            swatchesEl.style.borderColor = text;
          }

          bindPaletteButtons() {
            swatchesEl.innerHTML = '';
            this.applyPalette(PAL[this.state.palette]);
            PAL.forEach((p, i) => {
              const btn = document.createElement('button');
              btn.className = 'swatch';
              btn.title = p[0];
              btn.setAttribute('aria-label', p[0]);
              btn.style.background = p[1];
              btn.style.borderColor = this.state.palette === i ? '#fff' : 'transparent';
              btn.style.transform = this.state.palette === i ? 'scale(1.1)' : 'scale(1)';
              btn.innerHTML = `<span class="swatch-dot" style="background:${p[2]}"></span>`;
              btn.addEventListener('click', () => {
                this.state.palette = i;
                this.applyPalette(PAL[i]);
                this.bindPaletteButtons();
              });
              swatchesEl.appendChild(btn);
            });
          }

          init() {
            this.initUI();
            requestAnimationFrame(() => this.loop());
          }

          loop() {
            this.frame();
            requestAnimationFrame(() => this.loop());
          }
        }

        const garden = new TypeGarden();
        garden.init();
      })();
    </script>
