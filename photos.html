<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Overview</title>
    <style>
      :root {
        --bg: #f5f3f0;
        --text: #0c0c0c;
        --col-gap: 6vw;
        --row-gap: 22vh;
        --offset-gap: 12vh;
        --cubic: cubic-bezier(0.77, 0, 0.175, 1);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      body {
        position: relative;
        overflow-x: hidden;
        background: var(--bg);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .page-transition {
        position: fixed;
        inset: 0;
        z-index: 2000;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        background: rgba(17, 17, 17, 0.96);
        transform: scale(1.02);
        transition: opacity 0.28s ease, visibility 0.28s ease, transform 0.6s ease;
      }

      .page-transition.is-active {
        opacity: 1;
        visibility: visible;
        transform: scale(1);
      }

      .back-button {
        position: fixed;
        top: 24px;
        left: 24px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        cursor: pointer;
        padding: 9px 12px;
        margin: 0;
        font-family: "DM Mono", ui-monospace, monospace;
        font-size: 14px;
        letter-spacing: 0.04em;
        color: var(--text);
        opacity: 0.82;
        transition: opacity 0.2s ease, color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
      }

      .back-button:hover { opacity: 1; }
      .back-button:active { opacity: 0.5; }

      .back-button.is-inverted {
        color: #fff;
        background: rgba(0, 0, 0, 0.26);
        border-color: rgba(255, 255, 255, 0.22);
      }

      .overview-wrap {
        width: 110%;
        position: relative;
        left: -5%;
        padding: 0 0 80px;
      }

      .overview-grid {
        --offset-gap: 12vh;
        --col-gap: 6vw;
        --row-gap: 22vh;
        --translate-x: 0px;
        --translate-y: 0px;
        overflow: hidden;
        width: 100%;
        position: relative;
        top: calc(var(--offset-gap) * -1);
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        column-gap: var(--col-gap);
        row-gap: var(--row-gap);
      }

      .overview-item {
        position: relative;
        height: 100px;
        height: calc((100svh + var(--offset-gap) * 2) / 3 - var(--row-gap) * 2 / 3);
        opacity: 0 !important;
      }

      .overview-item:nth-child(5n + 2),
      .overview-item:nth-child(5n + 4) {
        transform: translateY(calc(50% + var(--row-gap) / 2));
      }

      .overview-item.is--visible {
        z-index: var(--z-index, 1);
        transition: opacity 0s;
        transition-delay: calc(var(--z-index, 1) * .1s);
      }

      .fs-media {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 110%;
        height: 120%;
        transform: translate(calc(var(--translate-x) - 50%), calc(var(--translate-y) - 50%));
      }

      .fs-media a {
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .fs-media img {
        position: absolute;
        top: 50%;
        left: 50%;
        max-width: 100%;
        max-height: 100%;
        width: auto;
        height: auto;
        transform: translate(-50%, -50%);
        pointer-events: all;
        object-fit: cover;
        filter: contrast(1.04) saturate(0.9) brightness(0.98);
        transition: transform 0.8s var(--cubic), filter 0.8s var(--cubic);
      }

      .overview-item:hover .fs-media img {
        transform: translate(-50%, -50%) scale(1.03);
        filter: contrast(1.08) saturate(0.96) brightness(1.02);
      }

      body.has--loaded .overview-item {
        opacity: 1 !important;
        display: inline-block;
      }

      body.has--finished .overview-item.is--visible .fs-media {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        transition: all 0.2s var(--cubic);
        transition-delay: calc(var(--delay, 1) * .01s);
        transition-duration: var(--duration);
      }

      body.has--finished .overview-item .fs-media {
        transition: opacity 0.49s ease;
        opacity: 1 !important;
      }

      html.has--landed .overview-item {
        opacity: 1 !important;
      }

      html.has--landed .overview-item .fs-media {
        opacity: 1 !important;
      }

      @media (orientation: portrait) and (max-width: 768px) {
        .overview-grid {
          --col-gap: 16px;
          --offset-gap: 8vh;
          width: 100%;
          left: 0;
        }

        .fs-media {
          width: 160%;
          height: 70%;
        }
      }

      @media (max-width: 900px) {
        .overview-wrap {
          width: 100%;
          left: 0;
          padding-top: 4vh;
        }

        .overview-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          column-gap: 18px;
          row-gap: 20vh;
        }

        .overview-item {
          height: 48vh;
        }
      }

      @media (max-width: 560px) {
        .back-button {
          top: 16px;
          left: 16px;
          font-size: 13px;
        }

        .overview-wrap {
          padding-top: 20px;
        }

        .overview-grid {
          grid-template-columns: 1fr;
          row-gap: 12vh;
        }

        .overview-item {
          height: 52vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-transition" aria-hidden="true"></div>
    <button class="back-button" type="button" onclick="navigateBack()">← Back</button>

    <main class="overview-wrap" aria-label="Photo overview gallery">
      <div id="gallery" class="overview-grid" aria-live="polite"></div>
    </main>

    <script src="audio-controller.js"></script>
    <script>
      const gallery = document.getElementById('gallery');
      const transition = document.querySelector('.page-transition');

      const galleryConfig = {
        images: [
          { title: '23-08_1064 bis', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/09/23-08_1064-bis-512x683.webp' },
          { title: '04', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/02/04-512x384.webp' },
          { title: '05', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/02/05-512x683.webp' },
          { title: '06', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/02/06-512x683.webp' },
          { title: 'GC_18-01_VIF_TRENCH_09-001_cover_bis', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/05/GC_18-01_VIF_TRENCH_09-001_cover_bis-512x683.webp' },
          { title: '18-01_VIF_TRENCH_08-086 bis', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/05/18-01_VIF_TRENCH_08-086-bis-512x683.webp' },
          { title: '_DSC6624 copy', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/04/DSC6624-copy-512x384.webp' },
          { title: '21-07_APULIA_667', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/05/21-07_APULIA_667-512x683.webp' },
          { title: '_DSC6870 copy', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/04/DSC6870-copy-512x384.webp' },
          { title: '_DSC6946', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/06/DSC6946-512x683.webp' },
          { title: '_DSC3401', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/06/DSC3401-512x683.webp' },
          { title: '_DSC1784', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/06/DSC1784-512x683.webp' },
          { title: '_DSC0840', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/06/DSC0840-512x683.webp' },
          { title: '23-08_1045', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/04/23-08_1045-512x683.webp' },
          { title: '22-08_ADRIA_754', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/06/22-08_ADRIA_754-512x683.webp' },
          { title: 'Lisan10', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/06/Lisan10-512x683.webp' },
          { title: '19-04_LANZAROTE_045', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/06/19-04_LANZAROTE_045-512x683.webp' },
          { title: '24-07_LAGO DI GARDA_308', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/08/24-07_LAGO-DI-GARDA_308-512x683.webp' },
          { title: '25-08_LANDES_229', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/08/25-08_LANDES_229-512x683.webp' },
          { title: '23-08_900 1', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/08/23-08_900-1-512x683.webp' },
          { title: '23-08_780', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/08/23-08_780-512x683.webp' },
          { title: '22-09_028', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/08/22-09_028-512x683.webp' },
          { title: '22-10_257', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/08/22-10_257-512x683.webp' },
          { title: '25-08_LANDES_290 1', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/08/25-08_LANDES_290-1-512x683.webp' },
          { title: '15', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/04/15-512x683.webp' },
          { title: '16', url: 'https://cdn.gregorcollienne.com/wp-content/uploads/2026/04/16-512x683.webp' }
        ]
      };

      const photoSet = galleryConfig.images;
      let renderedCount = 0;
      let isAppending = false;

      function createCard(item, index) {
        const article = document.createElement('article');
        article.className = 'overview-item is--visible';
        article.innerHTML = `
          <div class="fs-media">
            <a href="#" aria-label="${item.title}">
              <img src="${item.url}" alt="${item.title}" loading="lazy" />
            </a>
          </div>
        `;
        article.style.setProperty('--z-index', String(index + 1));
        return article;
      }

      function applyInitialOffsets() {
        const items = Array.from(document.querySelectorAll('.overview-item.is--visible'));
        if (!items.length) return;

        const zIndexes = Array.from({ length: items.length }, (_, i) => i + 1);
        for (let i = zIndexes.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [zIndexes[i], zIndexes[j]] = [zIndexes[j], zIndexes[i]];
        }

        const delays = Array.from({ length: items.length }, (_, i) => i + 1);
        for (let i = delays.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [delays[i], delays[j]] = [delays[j], delays[i]];
        }

        items.forEach((item, index) => {
          const rect = item.getBoundingClientRect();
          const width = rect.width;
          const viewportWidth = window.innerWidth;
          const viewportHeight = window.innerHeight;
          const offsetCenterX = (viewportWidth - width) / 2 - rect.left;
          const offsetCenterY = (viewportHeight - rect.height) / 2;
          const moveY = offsetCenterY - rect.top;
          const duration = (0.6 * Math.random() + 0.8).toFixed(2);

          item.style.setProperty('--translate-x', `${offsetCenterX}px`);
          item.style.setProperty('--translate-y', `${moveY}px`);
          item.style.setProperty('--z-index', String(zIndexes[index]));
          item.style.setProperty('--delay', String(delays[index]));
          item.style.setProperty('--duration', `${duration}s`);
        });
      }

      function appendPhotos(count = 12) {
        if (isAppending || !photoSet.length) return;
        isAppending = true;

        const nextItems = Array.from({ length: count }, (_, index) => {
          const sourceIndex = (renderedCount + index) % photoSet.length;
          return photoSet[sourceIndex];
        });

        const fragment = document.createDocumentFragment();
        nextItems.forEach((photo, index) => {
          fragment.appendChild(createCard(photo, renderedCount + index));
        });

        gallery.appendChild(fragment);
        renderedCount += nextItems.length;

        requestAnimationFrame(() => {
          applyInitialOffsets();
          setTimeout(() => {
            isAppending = false;
          }, 120);
        });
      }

      function handleInfinityLoad() {
        const scrollY = window.scrollY || document.documentElement.scrollTop;
        const distanceToBottom = gallery.offsetHeight - (window.innerHeight + scrollY);

        if (distanceToBottom < 700) {
          appendPhotos(12);
        }
      }

      function updateBackButtonContrast() {
        const button = document.querySelector('.back-button');
        if (!button) return;

        const x = Math.round(button.getBoundingClientRect().left + button.offsetWidth / 2);
        const y = Math.round(button.getBoundingClientRect().top + button.offsetHeight / 2);
        const el = document.elementFromPoint(x, y);

        let candidate = el;
        while (candidate && candidate !== document.body) {
          if (candidate instanceof Element && candidate.matches('.overview-item, .fs-media, img, main, body')) {
            break;
          }
          candidate = candidate.parentElement;
        }

        const isDark = (() => {
          if (!candidate) return false;

          const rect = candidate.getBoundingClientRect();
          if (!rect.width || !rect.height) return false;

          const centerX = Math.min(Math.max(x, rect.left + 1), rect.right - 1);
          const centerY = Math.min(Math.max(y, rect.top + 1), rect.bottom - 1);
          const canvas = document.createElement('canvas');
          canvas.width = 1;
          canvas.height = 1;
          const context = canvas.getContext('2d');

          if (!context) return false;

          context.drawImage(candidate instanceof HTMLImageElement ? candidate : candidate.querySelector('img'), 0, 0, 1, 1);

          const imageData = context.getImageData(0, 0, 1, 1).data;
          const brightness = (imageData[0] * 299 + imageData[1] * 587 + imageData[2] * 114) / 1000;
          return brightness < 150;
        })();

        button.classList.toggle('is-inverted', isDark);
      }

      function navigateBack() {
        if (transition) {
          transition.classList.add('is-active');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 420);
          return;
        }

        window.location.href = 'index.html';
      }

      function initialiseGallery() {
        appendPhotos(16);
        requestAnimationFrame(() => {
          document.body.classList.add('has--loaded');
          setTimeout(() => {
            document.body.classList.add('has--finished');
            document.documentElement.classList.add('has--landed');
            updateBackButtonContrast();
          }, 900);
        });
      }

      document.addEventListener('DOMContentLoaded', initialiseGallery);
      window.addEventListener('scroll', () => {
        handleInfinityLoad();
        updateBackButtonContrast();
      }, { passive: true });
      window.addEventListener('resize', () => {
        applyInitialOffsets();
        updateBackButtonContrast();
      });
      window.addEventListener('load', () => {
        if (transition) {
          requestAnimationFrame(() => transition.classList.remove('is-active'));
        }
        updateBackButtonContrast();
      });
    </script>
  </body>
</html>
